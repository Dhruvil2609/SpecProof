name: specproof-local

services:
  postgres:
    image: postgres:16.14-alpine3.23
    container_name: specproof-postgres
    environment:
      POSTGRES_DB: specproof
      POSTGRES_USER: Admin
      POSTGRES_PASSWORD: Admin@123
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Admin -d specproof"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.10-alpine3.21
    container_name: specproof-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: specproof-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: specproof
      MINIO_ROOT_PASSWORD: specproof_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:9000/minio/health/live >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.3-management-alpine
    container_name: specproof-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: specproof
      RABBITMQ_DEFAULT_PASS: specproof_dev_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.5.4
    container_name: specproof-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:13.0.4
    container_name: specproof-grafana
    environment:
      GF_SECURITY_ADMIN_USER: specproof
      GF_SECURITY_ADMIN_PASSWORD: specproof_dev_password
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://localhost:3000/api/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.6.13
    container_name: specproof-loki
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./infra/monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    build:
      context: .
      dockerfile: infra/docker/mlflow/Dockerfile
    image: specproof/mlflow:v2.22.0-postgres
    container_name: specproof-mlflow
    command:
      - "mlflow"
      - "server"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "5000"
      - "--backend-store-uri"
      - "postgresql+psycopg2://Admin:Admin%40123@postgres:5432/specproof"
      - "--default-artifact-root"
      - "/mlflow/artifacts"
    ports:
      - "5000:5000"
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "/opt/mlflow/healthcheck.py",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.134.0
    container_name: specproof-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"
    volumes:
      - ./infra/monitoring/otel/collector.yml:/etc/otelcol-contrib/config.yml:ro

  platform-api:
    profiles: ["application"]
    build:
      context: .
      dockerfile: apps/platform-api/Dockerfile
    image: specproof/platform-api:0.1.0
    container_name: specproof-platform-api
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SpecProof: Host=postgres;Port=5432;Database=specproof;Username=Admin;Password=Admin@123
      Database__ApplyMigrations: "true"
      MeasurementService__BaseUrl: http://measurement-service:8010/
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      measurement-service:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  measurement-service:
    profiles: ["application"]
    build:
      context: .
      dockerfile: apps/measurement-service/Dockerfile
    image: specproof/measurement-service:0.1.0
    container_name: specproof-measurement-service
    ports:
      - "8010:8010"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8010/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  operator-ui:
    profiles: ["application"]
    build:
      context: .
      dockerfile: apps/operator-ui/Dockerfile
    image: specproof/operator-ui:0.1.0
    container_name: specproof-operator-ui
    ports:
      - "4173:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin-ui:
    profiles: ["application"]
    build:
      context: .
      dockerfile: apps/admin-ui/Dockerfile
    image: specproof/admin-ui:0.1.0
    container_name: specproof-admin-ui
    ports:
      - "4174:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  minio-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
  loki-data:
  mlflow-artifacts:
