groups:
  - name: specproof-phase7-pilot
    rules:
      - alert: SpecProofOfflineStations
        expr: specproof_pilot_station_offline_total > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Pilot station is offline
          runbook: documentation/pilot/SUPPORT-RUNBOOK.md#offline-station
      - alert: SpecProofQueueBacklog
        expr: specproof_pilot_station_queue_depth > 25
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Durable station queue backlog exceeds 25 items
          runbook: documentation/pilot/SUPPORT-RUNBOOK.md#queue-backlog
      - alert: SpecProofProcessingLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(specproof_inspection_stage_duration_milliseconds_bucket{stage="total"}[5m]))) > 15000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Inspection p95 latency exceeds the 15-second software gate
          runbook: documentation/pilot/SUPPORT-RUNBOOK.md#processing-latency
      - alert: SpecProofInspectionFailures
        expr: specproof_pilot_inspection_failures_15m > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: More than five invalid or failed inspections occurred in 15 minutes
          runbook: documentation/pilot/SUPPORT-RUNBOOK.md#inspection-failures
      - alert: SpecProofCalibrationExpiry
        expr: specproof_pilot_calibration_expiring_total > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Active calibration is expired or expires within 24 hours
          runbook: documentation/pilot/SUPPORT-RUNBOOK.md#calibration-expiry
      - alert: SpecProofDatabaseUnavailable
        expr: max(specproof_pilot_database_available) == 0 or absent(specproof_pilot_database_available)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Platform database is unavailable or pilot metrics are absent
          runbook: documentation/pilot/SUPPORT-RUNBOOK.md#database-unavailable
