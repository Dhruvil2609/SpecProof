name: dotnet

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    name: .NET build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore SpecProof.slnx
      - run: dotnet build SpecProof.slnx --configuration Release --no-restore
      - run: dotnet test SpecProof.slnx --configuration Release --no-build --collect:"XPlat Code Coverage"
