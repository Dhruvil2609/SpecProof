name: phase8-packaging

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-service-package:
    name: Windows x64 station service package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.11
      - run: uv sync --group runtime --group station --group dev
      - run: uv run python tools/packaging/build_windows_station_package.py --version 0.1.0-ci --output-dir artifacts/packages
      - shell: pwsh
        run: |
          $archive = Get-ChildItem artifacts/packages/*.zip | Select-Object -First 1
          uv run python -c "from pathlib import Path; from tools.packaging.build_windows_station_package import verify_windows_station_package; verify_windows_station_package(Path(r'$($archive.FullName)'))"
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path installers/windows/install-service.ps1),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - uses: actions/upload-artifact@v4
        with:
          name: specproof-station-win-x64
          path: artifacts/packages/*.zip
